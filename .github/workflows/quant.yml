name: tsmx-quant

on:
  push:
    branches: ['**']
    paths-ignore:
      - results.md
      - run.log
      - reclaim_backtest.py
      - reclaim_backtest.md
      - reclaim_run.log
      - .github/workflows/reclaim.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quant-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tsmx_quant.py
        run: |
          set -o pipefail
          python tsmx_quant.py 2>&1 | tee run.log

      - name: Commit results.md and run.log
        if: always()
        run: |
          RUN_UTC=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch run.log
          git add -f run.log
          [ -f results.md ] && git add -f results.md
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "quant: results.md + run.log (${RUN_UTC}, job ${{ job.status }})"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
